name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: web
        run: npm run build

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare local environment file
        run: |
          cp .env.example .env
          cp deploy/participant-node/.env.example deploy/participant-node/.env
      - name: Validate main Compose file
        run: docker compose -f docker-compose.example.yml  config --quiet
      - name: Validate participant node Compose file
        run: docker compose -f deploy/participant-node/compose.yaml config --quiet
