name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: Go unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit and PostgreSQL integration tests
        run: sh ./scripts/test-integration.sh
      - name: Report package coverage
        run: go tool cover -func=coverage.out

  web-test:
    name: Web tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Run all Web tests
        working-directory: web
        run: npm test
      - name: Check formatting
        working-directory: web
        run: npm run format:check
      - name: Check lint
        working-directory: web
        run: npm run lint:check
      - name: Build Web application
        working-directory: web
        run: npm run build

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare local environment file
        run: |
          cp .env.example .env
          cp deploy/participant-node/.env.example deploy/participant-node/.env
      - name: Validate main Compose file
        run: docker compose -f docker-compose.example.yml config --quiet
      - name: Validate test Compose file
        run: docker compose -f docker-compose.test.yml config --quiet
      - name: Validate participant node Compose file
        run: docker compose -f deploy/participant-node/compose.yaml config --quiet
