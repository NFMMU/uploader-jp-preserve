services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: archive_test
      POSTGRES_USER: archive_test
      POSTGRES_PASSWORD: archive_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_test -d archive_test"]
      interval: 2s
      timeout: 3s
      retries: 30
