services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: arigaio/atlas:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["migrate", "apply", "--env", "local"]
    environment:
      DATABASE_URL: postgres://archive:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/archive?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Prepare persistent named volumes for the non-root distroless containers.
  staging-data-init:
    image: alpine:3.20
    command:
      [
        "sh",
        "-ec",
        "mkdir -p /data/staging && chown -R 65532:65532 /data/staging",
      ]
    volumes:
      - staging_data:/data/staging
    restart: "no"

  delivery-data-init:
    image: alpine:3.20
    command:
      [
        "sh",
        "-ec",
        "mkdir -p /data/delivery && chown -R 65532:65532 /data/delivery",
      ]
    volumes:
      - delivery_data:/data/delivery
    restart: "no"

  api:
    # build: .
    image: ghcr.io/nfmmu/uploader-jp-preservation-api:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ADDR: ":8080"
      DATABASE_URL: postgres://archive:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/archive?sslmode=disable
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      STAGING_DIR: /data/staging
      DELIVERY_DIR: /data/delivery
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - staging_data:/data/staging
      - delivery_data:/data/delivery
    depends_on:
      migrate:
        condition: service_completed_successfully
      staging-data-init:
        condition: service_completed_successfully
      delivery-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    #build: ./web
    image: ghcr.io/nfmmu/uploader-jp-preservation-web:latest
    pull_policy: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  delivery_data:
  staging_data:
